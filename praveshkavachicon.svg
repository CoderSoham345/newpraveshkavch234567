<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024' width='1024' height='1024'>
  <defs>
    <!-- Gradients -->
    <linearGradient id='shieldBg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a' />
      <stop offset='100%' stop-color='#1e293b' />
    </linearGradient>
    
    <linearGradient id='cyanGlow' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#38bdf8' />
      <stop offset='50%' stop-color='#06b6d4' />
      <stop offset='100%' stop-color='#0284c7' />
    </linearGradient>

    <linearGradient id='goldLock' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#fef08a' />
      <stop offset='50%' stop-color='#f59e0b' />
      <stop offset='100%' stop-color='#d97706' />
    </linearGradient>

    <linearGradient id='emeraldTick' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#34d399' />
      <stop offset='100%' stop-color='#059669' />
    </linearGradient>

    <filter id='dropGlow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='12' stdDeviation='16' flood-color='#06b6d4' flood-opacity='0.35' />
    </filter>
  </defs>

  <!-- Transparent background canvas -->

  <g filter='url(#dropGlow)'>
    <!-- Outer Shield Frame -->
    <path d='M512 88 L832 200 C832 540 680 790 512 936 C344 790 192 540 192 200 Z' 
          fill='url(#shieldBg)' 
          stroke='url(#cyanGlow)' 
          stroke-width='24' 
          stroke-linejoin='round' />

    <!-- Inner Shield Accent Line -->
    <path d='M512 136 L792 234 C792 530 656 752 512 880 C368 752 232 530 232 234 Z' 
          fill='none' 
          stroke='url(#cyanGlow)' 
          stroke-width='10' 
          stroke-dasharray='16 8' 
          opacity='0.6' />

    <!-- Central Security Lock Shackle -->
    <path d='M416 410 V340 C416 287 459 244 512 244 C565 244 608 287 608 340 V410' 
          fill='none' 
          stroke='url(#goldLock)' 
          stroke-width='36' 
          stroke-linecap='round' />

    <!-- Lock Body -->
    <rect x='368' y='410' width='288' height='260' rx='36' 
          fill='url(#goldLock)' 
          stroke='#b45309' 
          stroke-width='8' />

    <!-- Camera / Biometric Eye Circle inside Lock Body -->
    <circle cx='512' cy='520' r='54' fill='#0f172a' stroke='url(#cyanGlow)' stroke-width='10' />
    
    <!-- Verified Checkmark / Keyhole Center -->
    <path d='M480 520 L502 542 L546 498' 
          fill='none' 
          stroke='url(#emeraldTick)' 
          stroke-width='14' 
          stroke-linecap='round' 
          stroke-linejoin='round' />

    <!-- Bottom Security Star/Emblem -->
    <path d='M512 710 L526 740 L558 742 L533 763 L541 794 L512 777 L483 794 L491 763 L466 742 L498 740 Z' 
          fill='url(#cyanGlow)' />
  </g>
</svg>