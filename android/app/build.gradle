apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.praveshkavach.vms"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.praveshkavach.vms"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Jetpack Compose
    buildFeatures {
        compose true
    }

    // Java and Kotlin must use the same JVM target
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {

    // Local JAR files
    implementation fileTree(
        include: ['*.jar'],
        dir: 'libs'
    )

    // AndroidX
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    // Capacitor
    implementation project(':capacitor-android')

    // OpenCV
    implementation 'org.opencv:opencv:4.9.0'

    // CameraX
    def camera_version = "1.3.1"

    implementation "androidx.camera:camera-core:${camera_version}"
    implementation "androidx.camera:camera-camera2:${camera_version}"
    implementation "androidx.camera:camera-lifecycle:${camera_version}"
    implementation "androidx.camera:camera-view:${camera_version}"

    // Jetpack Compose
    implementation "androidx.compose.ui:ui:1.7.8"
    implementation "androidx.compose.ui:ui-graphics:1.7.8"
    implementation "androidx.compose.ui:ui-tooling-preview:1.7.8"
    implementation "androidx.compose.foundation:foundation:1.7.8"
    implementation "androidx.compose.material3:material3:1.3.1"

    // Compose + Android integration
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"

    // Testing
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"

    // Capacitor Cordova plugins
    implementation project(':capacitor-cordova-android-plugins')
}

// Capacitor
apply from: 'capacitor.build.gradle'

// Google Services
try {
    def servicesJSON = file('google-services.json')

    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch (Exception e) {
    logger.info(
        "google-services.json not found, google-services plugin not applied. Push Notifications won't work"
    )
}